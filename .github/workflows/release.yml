name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} must match version.py (v$version)."
          }

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $changelog = [IO.File]::ReadAllText("CHANGELOG.md", [Text.Encoding]::UTF8)
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\].*?\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
            throw "CHANGELOG.md must contain non-empty release notes for version $version."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [IO.File]::WriteAllText($notesPath, $match.Groups[1].Value.Trim() + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build application and installer
        shell: cmd
        env:
          ACC_PITWALL_NONINTERACTIVE: "1"
        run: BUILD.bat installer

      - name: Sign release files when certificate is configured
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -and
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Host "No signing certificate configured; release files will remain unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Configure both Windows signing certificate secrets."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "acc-pitwall-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            $files = @(
              "dist\ACC_PitWall.exe",
              (Get-ChildItem "dist\ACC_PitWall_Setup_v*.exe" | Select-Object -First 1).FullName
            )
            foreach ($file in $files) {
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD $file
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file." }
            }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: false
          files: |
            dist/ACC_PitWall.exe
            dist/ACC_PitWall_Setup_v*.exe
